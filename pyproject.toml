[project]
name = "base_attackers"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "arcade>=3.3.3,<4.0",
    "arcade-game-framework @ git+https://github.com/darthwilliam1118/arcade-game-framework@1e89589ddd777b1f94506168c223b0d4e6cd6c03",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "black",
    "cookiecutter",
    "pyinstaller>=6.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
