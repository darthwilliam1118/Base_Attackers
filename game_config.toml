[game]
starting_level = 5
num_lives = 6
music_volume = 80
effects_volume = 80
debug = true
god_mode = false
max_window_height = 800
sprite_scale = 0.5

[background]
background_image = "assets/images/background.png"
star_count = 300
star_speed_min = 20.0
star_speed_max = 120.0

[ui]
popup_duration = 0.8
popup_rise_speed = 60.0

[window]
# Authoritative window size (overrides agf's max_window_height-derived
# square default).  Wide 16:9 for this horizontal scroller.
width = 1422
height = 800
title = "Base Attackers"

[ship]
accel = 600.0
friction = 0.20
max_speed_x = 350.0
max_speed_y = 300.0
hp = 3
hit_radius = 16.0
gravity = 0
fuel_capacity = 100.0
fuel_drain_rate = 4.0
fuel_gravity = 150.0
fuel_canister_restore = 25.0

[fuel_tower]
transfer_rate = 20.0
snap_distance = 40.0
tower_capacity = 60.0
spawn_pressure_interval = 3.0

[combat]
player_bullet_speed = 600.0
player_fire_cooldown = 0.25
player_bullet_damage = 1
enemy_bullet_speed = 250.0
enemy_bullet_lifetime = 3.0     # seconds before an enemy bullet expires
missile_speed = 200.0
missile_proximity_trigger = 180.0
turret_fire_cooldown = 2.0
turret_aim_jitter = 0.15
turret_rotation_speed = 90.0
silo_hp = 2
turret_hp = 3
bullet_cull_margin = 64.0

# Patrol ships
patrol_hp = 2
patrol_speed_min = 150.0        # px/s — straight pass
patrol_speed_max = 280.0        # px/s — kamikaze
patrol_intercept_lead = 0.6     # fraction of ship velocity added to aim
patrol_ram_damage = 1           # HP lost when patrol ship contacts player
patrol_spawn_margin = 60.0      # px off right edge of camera on spawn
patrol_spawn_interval = 6.0     # seconds between autonomous patrol spawns
patrol_fire_cooldown = 2.5      # seconds between patrol shots (non-kamikaze)

# Laser turrets
laser_turret_hp = 4
laser_turret_fire_cooldown = 3.5
laser_telegraph_duration = 0.6  # seconds warning beam is visible
laser_beam_duration = 0.12      # seconds full beam is visible
laser_beam_damage = 1           # HP per beam hit
laser_beam_width = 3.0          # px line width for draw call
laser_proximity_trigger = 260.0  # px — turret activates when ship is within
laser_beam_color = [255, 60, 60, 220]   # RGBA
laser_telegraph_color = [255, 180, 60, 120]   # RGBA dim orange

[terrain]
chunk_width = 32
cull_buffer_chunks = 3

[level_gen]
max_difficulty_level = 10      # level at which difficulty reaches 1.0
boss_zone_fraction = 0.85      # world X fraction where boss zone starts
entry_clear_fraction = 0.05    # first N% of world kept clear (entry zone)
run_seed = 0                   # 0 = random per game; non-zero = reproducible

# Fuel towers — guaranteed refuel points; count decreases with difficulty.
tower_count_max = 4            # level 1
tower_count_min = 2            # max difficulty
tower_min_spacing = 800.0      # minimum px between towers
tower_ceiling_unlock_level = 4 # level at which ceiling towers can appear

# Missile silos
silo_density_min = 0.0003      # silos per px of playfield at level 1
silo_density_max = 0.0010      # silos per px at max difficulty
silo_min_spacing = 350.0       # minimum px between any two silos
silo_ceiling_fraction_min = 0.0
silo_ceiling_fraction_max = 0.5
silo_unlock_level = 1

# Gun turrets
turret_density_min = 0.0002
turret_density_max = 0.0008
turret_min_spacing = 400.0
turret_ceiling_fraction_min = 0.0
turret_ceiling_fraction_max = 0.4
turret_unlock_level = 1

# Laser turrets
laser_density_min = 0.0
laser_density_max = 0.0004
laser_min_spacing = 600.0
laser_ceiling_fraction_min = 0.0
laser_ceiling_fraction_max = 0.3
laser_unlock_level = 3         # not available until level 3

[powerups]
fall_speed_min = 40.0
fall_speed_max = 100.0

# Spawn interval per level (seconds). Higher levels = more frequent.
# Original values
spawn_interval_level_1 = 20.0
spawn_interval_level_2 = 14.0
spawn_interval_level_3 = 10.0
spawn_interval_default = 8.0   # level 4+

# Effect durations (seconds) for timed effects.
rapid_fire_duration = 8.0
big_gun_duration = 10.0
multi_shot_duration = 8.0
shield_duration = 12.0

# Stat modifier magnitudes.
rapid_fire_cooldown_multiplier = 0.4   # fire_cooldown * this value
big_gun_damage_bonus = 1               # extra damage per shot

[powerups.weights.level_1]
# Empty — no power-ups spawn on level 1.

[powerups.weights.level_2]
fuel_canister = 5
health = 3

[powerups.weights.level_3]
fuel_canister = 5
health = 3
rapid_fire = 2

[powerups.weights.level_4]
fuel_canister = 4
health = 3
rapid_fire = 2
big_gun = 2

[powerups.weights.level_5]
fuel_canister = 4
health = 2
rapid_fire = 2
big_gun = 2
multi_shot = 1
shield = 1

[powerups.weights.default]
fuel_canister = 3
health = 2
rapid_fire = 2
big_gun = 2
multi_shot = 2
shield = 2

[level_1]
world_width = 6400
world_height = 720
terrain_amplitude = 80.0
terrain_frequency = 0.008
terrain_half_width = 280.0
ceiling_present = false
terrain_renderer = "polygon"
terrain_seed = 0

[level_2]
world_width = 6400
world_height = 720
terrain_amplitude = 85.0
terrain_frequency = 0.008
terrain_half_width = 280.0
ceiling_present = true
terrain_renderer = "polygon"
terrain_seed = 0

[level_3]
world_width = 6400
world_height = 720
terrain_amplitude = 90.0
terrain_frequency = 0.01
terrain_half_width = 250.0
ceiling_present = true
terrain_renderer = "tile"
terrain_seed = 0